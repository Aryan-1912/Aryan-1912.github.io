<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Embedded &amp; IoT Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6;--panel:#ffffff;--ink:#0e2a47;--mute:#4c6580;--line:#c5d2de;
  --cu:#9a5414;--cu-bg:#f6e6d3;--term:#0b2038;--term-ink:#dfe9f2;--term-dim:#8aa3bb;--ok:#7fd1a0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b2038;--panel:#102b4a;--ink:#e8eef3;--mute:#9bb2c7;--line:#27456a;
    --cu:#e8a05a;--cu-bg:#3a2a1a;--term:#06162a;--term-ink:#dfe9f2;--term-dim:#7f98b0;--ok:#7fd1a0;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b2038;--panel:#102b4a;--ink:#e8eef3;--mute:#9bb2c7;--line:#27456a;
  --cu:#e8a05a;--cu-bg:#3a2a1a;--term:#06162a;--term-ink:#dfe9f2;--term-dim:#7f98b0;--ok:#7fd1a0;color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "Archivo",system-ui,sans-serif;min-height:100%}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.25rem}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
a{color:var(--cu)}
:focus-visible{outline:3px solid var(--cu);outline-offset:2px}

header.top{padding:2.5rem 0 1.5rem;background:linear-gradient(180deg,color-mix(in srgb,#8b5cf6 14%,transparent),transparent 70%)}
.skills>div{border-left:4px solid var(--tc);padding-left:.8rem}.skills>div:nth-child(1){--tc:#3b82f6}.skills>div:nth-child(2){--tc:#8b5cf6}.skills>div:nth-child(3){--tc:#10b981}.skills>div:nth-child(4){--tc:#f59e0b}.skills>div:nth-child(5){--tc:#ec4899}
h1{font-weight:800;font-stretch:80%;font-size:clamp(2.6rem,8vw,5rem);line-height:1;margin:0 0 .9rem;letter-spacing:-.02em}
.lede{max-width:34rem;color:var(--mute);margin:0}

/* console: the one memorable element */
.console{background:var(--term);color:var(--term-ink);border-radius:6px;margin:1.5rem 0 0;border:1px solid var(--line);overflow:hidden}
.console .bar{display:flex;justify-content:space-between;padding:.5rem .9rem;border-bottom:1px solid #1d3a5c;color:var(--term-dim);font-size:.8rem}
.console .bar b{color:var(--ok);font-weight:600}
#out{height:17rem;overflow-y:auto;padding:.9rem;font-size:.88rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#out .dim{color:var(--term-dim)}#out .ok{color:var(--ok)}#out .cu{color:#e8a05a}
.prompt{display:flex;gap:.5rem;padding:.6rem .9rem;border-top:1px solid #1d3a5c;font-size:.88rem}
.prompt label{color:var(--ok)}
.prompt input{flex:1;min-width:0;background:transparent;border:0;color:inherit;font:inherit;outline:0}
.prompt:focus-within{box-shadow:inset 0 0 0 2px var(--cu)}
.hints{padding:.5rem .9rem .8rem;display:flex;gap:.4rem;flex-wrap:wrap}
.hints button{font:inherit;font-size:.78rem;background:#12304f;color:var(--term-ink);border:1px solid #27456a;border-radius:4px;padding:.25rem .6rem;cursor:pointer}
.hints button:hover{border-color:#e8a05a}

section{padding:2.75rem 0 0}
h2::after{content:"";display:block;width:4.5rem;height:5px;margin-top:.35rem;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#10b981,#f59e0b,#ec4899)}
h2{font-weight:700;font-stretch:85%;font-size:1.9rem;margin:0 0 .4rem;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 1.25rem}

.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
.chip{font:inherit;font-size:.9rem;padding:.35rem .85rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;cursor:pointer}
.chip{border-width:1.5px;border-color:var(--tc,var(--line))}.chip[aria-pressed="true"]{background:var(--tc,var(--ink));color:#0b1220;font-weight:600}

.proj{border:1px solid var(--line);border-left:6px solid var(--tc,var(--cu));background:var(--panel);border-radius:6px;margin-bottom:.75rem}
.proj>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:.25rem 1rem;width:100%;padding:1rem 1.1rem;cursor:pointer}
.proj>button:focus-visible{outline:3px solid var(--cu);outline-offset:-3px}
.proj h3{margin:0;font-size:1.2rem;font-weight:700}
.proj .mcu{color:var(--mute);font-size:.82rem;grid-column:1}
.proj .tags{grid-column:1;display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.tag{font-size:.78rem;background:color-mix(in srgb,var(--tc,var(--cu)) 18%,transparent);color:var(--ink);border:1.5px solid var(--tc,var(--cu));padding:0 .5rem;border-radius:999px}
.proj .chev{grid-column:2;grid-row:1/3;align-self:center;font-size:1.4rem;color:var(--cu);transition:transform .2s}
.proj[data-open="true"] .chev{transform:rotate(90deg)}
.body{display:none;padding:0 1.1rem 1.2rem;border-top:1px solid var(--line)}
.proj[data-open="true"] .body{display:block}
.body p{margin:1rem 0;max-width:40rem}
.meters{display:grid;gap:.5rem;max-width:30rem;margin:1rem 0}
.meter .lbl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute)}
.meter .track{height:8px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:.25rem}
.meter .fill{height:100%;background:var(--cu);width:0;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.proj[data-open="true"] .fill{width:var(--w)}
.fact{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.92rem}.fact span:first-child{color:var(--mute)}.fact span:last-child{text-align:right;font-size:.82rem}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.75rem;margin:1.1rem 0 0;align-items:start}.gal figure{margin:0}.gal img{display:block;width:100%;height:auto;border-radius:4px;border:1px solid var(--line);background:#fff}.gal figcaption{font-size:.82rem;color:var(--mute);margin-top:.3rem}
.cap{margin:1.1rem 0 0;font-size:.8rem;color:var(--mute)}
pre{margin:.4rem 0 0;background:var(--term);color:var(--term-ink);padding:1rem;border-radius:4px;overflow-x:auto;font-size:.82rem;line-height:1.5}
.links{margin-top:1rem;font-size:.95rem}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.25rem 2rem}
.skills h3{font-size:1rem;margin:0 0 .35rem}
.skills p{margin:0;color:var(--mute);font-size:.95rem}
footer{padding:3rem 0 3.5rem;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.fill,.chev{transition:none}}

/* futuristic theme */
:root:root:root{--bg:#060a14;--panel:rgba(12,20,38,.72);--ink:#e6f1ff;--mute:#9bb2cf;--line:rgba(110,160,255,.24);--cu:#22d3ee;--cu-bg:rgba(34,211,238,.12);--term:rgba(2,6,16,.82);--term-ink:#d6e8ff;--term-dim:#7690b0;--ok:#4ade80;color-scheme:dark}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg svg{position:absolute;inset:0;width:100%;height:100%}
.bg .t{fill:none;stroke:#22d3ee;stroke-opacity:.17;stroke-width:1.2}
.bg .n{fill:#06101f;stroke:#22d3ee;stroke-opacity:.45}
.bg .p{fill:#67e8f9;filter:drop-shadow(0 0 5px #22d3ee)}
.aurora{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.26}
.a1{background:#6d28d9;top:-25vmax;left:-15vmax;animation:d1 24s ease-in-out infinite alternate}
.a2{background:#0891b2;bottom:-30vmax;right:-20vmax;animation:d2 28s ease-in-out infinite alternate}
.gridbg{position:absolute;inset:-48px;background-image:linear-gradient(rgba(120,170,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.07) 1px,transparent 1px);background-size:48px 48px;animation:grid 14s linear infinite;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%)}
.wrap{position:relative;z-index:1}
h1,h2{font-family:"Chakra Petch","Archivo",sans-serif;font-weight:700;font-stretch:100%}
h2{letter-spacing:.02em}
@supports (background-clip:text) or (-webkit-background-clip:text){h1{background:linear-gradient(90deg,#e6f1ff 0%,#22d3ee 30%,#a78bfa 60%,#e6f1ff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 9s linear infinite}}
.console{position:relative;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-color:rgba(34,211,238,.4);box-shadow:0 0 40px -14px #22d3ee}
.console::after{content:"";position:absolute;left:0;right:0;top:-30%;height:30%;background:linear-gradient(transparent,rgba(34,211,238,.07),transparent);animation:scan 6s linear infinite;pointer-events:none}
.console .bar b{animation:pulse 2s ease-in-out infinite}
.proj,.skills>div{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.skills>div{padding:.8rem .9rem;border-radius:6px}
.proj{transition:box-shadow .25s,transform .25s;animation:cardin .55s cubic-bezier(.2,.7,.2,1) both}
.proj:nth-child(2){animation-delay:.08s}.proj:nth-child(3){animation-delay:.16s}.proj:nth-child(4){animation-delay:.24s}
.proj:hover,.proj[data-open="true"]{box-shadow:0 0 0 1px var(--tc,var(--cu)),0 12px 36px -14px var(--tc,var(--cu))}
.proj:hover{transform:translateY(-2px)}
.proj[data-open="true"] .body{animation:open .4s ease both}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@keyframes shimmer{to{background-position:250% 0}}
@keyframes scan{to{top:110%}}
@keyframes pulse{50%{opacity:.35}}
@keyframes cardin{from{opacity:0;transform:translateY(14px)}}
@keyframes open{from{opacity:0;transform:translateY(-6px)}}
@keyframes d1{to{transform:translate(12vmax,10vmax)}}
@keyframes d2{to{transform:translate(-10vmax,-8vmax)}}
@keyframes grid{to{transform:translate(48px,48px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="aurora a1"></div><div class="aurora a2"></div><div class="gridbg"></div><svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice"><path class="t" d="M0 120 H220 L260 160 H520 L560 120 H900 L940 160 H1200"/><path class="t" d="M0 360 H140 L180 400 H420 L460 440 H760 L800 400 H1200"/><path class="t" d="M0 620 H300 L340 580 H640 L680 620 H980 L1020 660 H1200"/><path class="t" d="M300 0 V140 L340 180 V420 L300 460 V800"/><path class="t" d="M900 0 V240 L860 280 V560 L900 600 V800"/><circle class="n" cx="220" cy="120" r="4"/><circle class="n" cx="560" cy="120" r="4"/><circle class="n" cx="940" cy="160" r="4"/><circle class="n" cx="140" cy="360" r="4"/><circle class="n" cx="460" cy="440" r="4"/><circle class="n" cx="800" cy="400" r="4"/><circle class="n" cx="340" cy="580" r="4"/><circle class="n" cx="680" cy="620" r="4"/><circle class="n" cx="1020" cy="660" r="4"/><circle class="n" cx="300" cy="460" r="4"/><circle class="n" cx="900" cy="600" r="4"/><circle class="p" r="3"><animateMotion dur="11s" begin="0s" repeatCount="indefinite" path="M0 120 H220 L260 160 H520 L560 120 H900 L940 160 H1200"/></circle><circle class="p" r="3"><animateMotion dur="13s" begin="-5s" repeatCount="indefinite" path="M0 360 H140 L180 400 H420 L460 440 H760 L800 400 H1200"/></circle><circle class="p" r="3"><animateMotion dur="10s" begin="-2s" repeatCount="indefinite" path="M0 620 H300 L340 580 H640 L680 620 H980 L1020 660 H1200"/></circle><circle class="p" r="3"><animateMotion dur="9s" begin="-6s" repeatCount="indefinite" path="M300 0 V140 L340 180 V420 L300 460 V800"/></circle><circle class="p" r="3"><animateMotion dur="12s" begin="-3s" repeatCount="indefinite" path="M900 0 V240 L860 280 V560 L900 600 V800"/></circle></svg></div>
<div class="wrap">
<header class="top">
  <h1 id="name">Your Name</h1>
  <p class="lede" id="tagline">Firmware engineer. I write C for small chips and connect them to the cloud.</p>

  <div class="console" role="region" aria-label="Interactive serial console">
    <div class="bar mono"><span>/dev/ttyUSB0 · 115200 8N1</span><b>● connected</b></div>
    <div id="out" class="mono" role="log" aria-live="polite" tabindex="0"></div>
    <form class="prompt mono" id="f" autocomplete="off">
      <label for="cmd">$</label>
      <input id="cmd" spellcheck="false" autocapitalize="off" aria-label="Type a command">
    </form>
    <div class="hints mono" id="hints"></div>
  </div>
</header>

<section id="projects">
  <h2>Projects</h2>
  <p class="sub">Select one to see the key figures and code.</p>
  <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
  <div id="list"></div>
</section>

<section id="skills">
  <h2>What I work with</h2>
  <div class="skills" id="skillgrid"></div>
</section>

<section id="education">
  <h2>Education</h2>
  <div class="skills" id="edulist"></div>
</section>

<section id="training">
  <h2>Training</h2>
  <div class="skills" id="trainlist"></div>
</section>

<footer>
  <p id="contact"></p>
</footer>
</div>

<script>
/* ===== EDIT THIS BLOCK: replace the sample content with your own ===== */
const PROFILE = {
  name: "Aryan Prajapati",
  tagline: "Computer Engineering Technology at Sheridan College. I write C for microcontrollers and build IoT systems from the PCB to the phone app.",
  links: [
    ["LinkedIn", "https://www.linkedin.com/in/aryan-prajapati-5ab386262/"],
    ["GitHub", "https://github.com/Aryan-1912"]
  ]
};
const PROJECTS = [
  { id:"household-iot", name:"IoT smart home controller (capstone)", mcu:"ESP32 · custom PCB · Sheridan College, Dec 2025",
    tags:["IoT","C","PCB","MQTT"],
    summary:"An ESP32 home automation system with a custom multi-layer PCB. It reads temperature and humidity from a DHT22, switches four relays, and talks to a Kotlin Android app through a HiveMQ cloud MQTT broker. I designed the board in Fusion 360 Eagle, and it was fabricated and assembled for the project. Built with teammates Manav Parikh and Dev Patel.",
    facts:[["Round-trip MQTT latency","under 500 ms"],["Sensor accuracy","99% against a calibrated multimeter"],["Relay channels","4"],["Testing","PCB continuity, relay load tests"]],
    gallery:[["real","The assembled board: ESP32 DevKit, four status LEDs, DHT22 sensor and filter capacitor."],["pcb","PCB layout designed in Fusion 360 Eagle."],["sch","Schematic of the controller."]],
    codeLabel:"System architecture",
    code:"[Android app] <--MQTT--> [HiveMQ cloud] <--MQTT--> [ESP32] --> [relays, DHT22]",
    link:"https://github.com/Aryan-1912/CAPSTONE_HOUSEHOLD_AUTOMATION_IOT" },
  { id:"pic24-rtos", name:"Multitasking with the Salvo RTOS", mcu:"PIC24 · XC16",
    tags:["RTOS","C","Embedded"],
    summary:"Four tasks share one PIC24 under the Salvo RTOS: a Knight Rider LED pattern that reverses on a debounced button press, a blinking run LED, and two tasks that read a temperature sensor and a potentiometer and print over UART. Four binary semaphores guard the UART, the ADC, the LEDs and the button event, and a Timer1 interrupt drives the RTOS tick.",
    facts:[["Tasks","4"],["Semaphores","4 (UART, ADC, LED, button)"],["RTOS tick","Timer1 interrupt, divided by 10"],["Peripherals","ADC, UART2, Timer1, GPIO"]],
    codeLabel:"RtosMain.c, temperature task",
    code:"void TaskTempUart(void)\n{\n    for (;;) {\n        OSWaitSem(ADC_MUTEX, OSNO_TIMEOUT);\n        uint16_t adc = ADC1_Read(TEMP_ADC_CH);\n        OSSignalSem(ADC_MUTEX);\n\n        float tC = AdcToTempC(adc);\n        g_SensorData.temperature = tC;\n\n        char buf[50];\n        sprintf(buf, \"[TEMP] %.2f C (ADC:%u)\\r\\n\", (double)tC, adc);\n\n        OSWaitSem(UART_MUTEX, OSNO_TIMEOUT);\n        UART2_WriteString(buf);\n        OSSignalSem(UART_MUTEX);\n\n        OS_Delay(50);   /* 500 ms */\n    }\n}",
    link:"https://github.com/Aryan-1912/RTOS-Application_PIC24" }
];
const SKILLS = [
  ["Embedded","ESP32, STM32, Arduino, PIC24, UART, SPI, I²C, ADC/DAC, MQTT, Salvo RTOS, PLC"],
  ["Software & Design","C, Python, VHDL, Assembly, Arduino IDE, Fusion 360, NI Multisim, AutoCAD, MPLAB, LabVIEW"]
];
const EDUCATION = [
  ["Computer Engineering Technology, Sheridan College","Capstone, December 2025: an IoT smart home controller with a custom multi-layer PCB, ESP32 firmware, MQTT and an Android app, built in a team of three."],
  ["Hands-on embedded work","Real-time multitasking on a PIC24 with the Salvo RTOS, using semaphores, timer interrupts, ADC sampling and UART logging."]
];
const TRAINING = [
  ["Emertxe, Bengaluru, India","Ongoing training"]
];
/* ===== end of editable content ===== */
const IMG = {real:"images/board-photo.jpg",pcb:"images/pcb-layout.jpg",sch:"images/schematic.jpg"};
const gal = p => p.gallery ? '<div class="gal">' + p.gallery.map(g => '<figure><img src="' + IMG[g[0]] + '" onerror="this.closest(\'figure\').remove()" alt="' + esc(g[1]) + '" loading="lazy"><figcaption>' + esc(g[1]) + "</figcaption></figure>").join("") + "</div>" : "";

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

$("#name").textContent = PROFILE.name;
$("#tagline").textContent = PROFILE.tagline;
document.title = PROFILE.name + " – Embedded & IoT portfolio";
$("#contact").innerHTML = PROFILE.links.map(l => '<a href="' + esc(l[1]) + '">' + esc(l[0]) + "</a>").join(" · ");
$("#edulist").innerHTML = EDUCATION.map(t => "<div><h3>" + esc(t[0]) + "</h3><p>" + esc(t[1]) + "</p></div>").join("");
$("#trainlist").innerHTML = TRAINING.map(t => "<div><h3>" + esc(t[0]) + "</h3><p>" + esc(t[1]) + "</p></div>").join("");
$("#skillgrid").innerHTML = SKILLS.map(s => "<div><h3>" + esc(s[0]) + "</h3><p>" + esc(s[1]) + "</p></div>").join("");

const TAGCOL = {C:"#3b82f6",RTOS:"#8b5cf6",IoT:"#10b981",PCB:"#f59e0b",MQTT:"#ec4899",Embedded:"#06b6d4"};
const col = t => TAGCOL[t] || "var(--cu)";
/* ----- projects ----- */
let active = "All";
const allTags = ["All", ...new Set(PROJECTS.flatMap(p => p.tags))];
function meter(label, used, total, unit) {
  const pct = Math.max(1, Math.round(used / total * 100));
  return '<div class="meter"><div class="lbl mono"><span>' + label + '</span><span>' + used + " / " + total + " " + unit + " (" + pct + '%)</span></div><div class="track"><div class="fill" style="--w:' + pct + '%"></div></div></div>';
}
function renderFilters() {
  $("#filters").innerHTML = allTags.map(t => '<button class="chip" style="--tc:' + col(t) + '" aria-pressed="' + (t === active) + '" data-tag="' + esc(t) + '">' + esc(t) + "</button>").join("");
}
function renderList() {
  const open = new Set([...document.querySelectorAll('.proj[data-open="true"]')].map(e => e.dataset.id));
  $("#list").innerHTML = PROJECTS.filter(p => active === "All" || p.tags.includes(active)).map(p =>
    '<article class="proj" style="--tc:' + col(p.tags[0]) + '" id="p-' + p.id + '" data-id="' + p.id + '" data-open="' + open.has(p.id) + '">' +
    '<button aria-expanded="' + open.has(p.id) + '" aria-controls="b-' + p.id + '"><h3>' + esc(p.name) + '</h3><span class="chev" aria-hidden="true">›</span>' +
    '<span class="mcu mono">' + esc(p.mcu) + '</span><span class="tags">' + p.tags.map(t => '<span class="tag" style="--tc:' + col(t) + '">' + esc(t) + "</span>").join("") + "</span></button>" +
    '<div class="body" id="b-' + p.id + '"><p>' + esc(p.summary) + "</p><div class=\"meters\">" +
    (p.flash ? meter("Flash", p.flash[0], p.flash[1], "KB") + meter("RAM", p.ram[0], p.ram[1], "KB") : "") + (p.facts || []).map(f => '<div class="fact"><span>' + esc(f[0]) + "</span><span class=\"mono\">" + esc(f[1]) + "</span></div>").join("") +
    "</div>" + gal(p) + "<p class=\"cap mono\">" + esc(p.codeLabel || "Code") + "</p><pre class=\"mono\"><code>" + esc(p.code) + '</code></pre><p class="links"><a href="' + esc(p.link) + '">View the repository</a></p></div></article>'
  ).join("") || "<p class=\"sub\">No projects with that tag.</p>";
}
function toggle(el, force) {
  const o = force !== undefined ? force : el.dataset.open !== "true";
  el.dataset.open = o;
  el.querySelector("button").setAttribute("aria-expanded", o);
}
$("#filters").addEventListener("click", e => {
  const b = e.target.closest("[data-tag]"); if (!b) return;
  active = b.dataset.tag; renderFilters(); renderList();
});
$("#list").addEventListener("click", e => {
  const b = e.target.closest(".proj > button"); if (b) toggle(b.parentElement);
});
renderFilters(); renderList();

/* ----- console ----- */
const out = $("#out");
function print(html, cls) {
  const d = document.createElement("div");
  d.innerHTML = cls ? '<span class="' + cls + '">' + html + "</span>" : html;
  out.appendChild(d); out.scrollTop = out.scrollHeight;
}
const boot = [
  ["[    0.000] boot: reset cause = power-on", "dim"],
  ["[    0.012] clk: 8 MHz crystal, timer1 tick running", "dim"],
  ["[    0.031] portfolio v1.0 ready", "ok"],
  ["Type <span class=\"cu\">help</span> or tap a command below.", ""]
];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
boot.forEach((l, i) => reduce ? print(l[0], l[1]) : setTimeout(() => print(l[0], l[1]), i * 280));

const find = q => PROJECTS.find(p => p.id === q || p.name.toLowerCase().includes(q));
const cmds = {
  help() { print("Commands: whoami, ls, cat &lt;id&gt;, open &lt;id&gt;, filter &lt;tag&gt;, skills, education, training, contact, clear"); },
  whoami() { print(esc(PROFILE.name) + " – " + esc(PROFILE.tagline)); },
  ls() { PROJECTS.forEach(p => print(p.id.padEnd(15) + " " + esc(p.mcu))); },
  cat(a) {
    const p = find(a); if (!p) return print("cat: no such project. Try ls.", "cu");
    print(esc(p.name) + " [" + p.tags.join(", ") + "]", "ok");
    print(esc(p.summary));
    (p.facts || []).forEach(f => print(esc(f[0]) + ": " + esc(f[1]), "dim"));
  },
  open(a) {
    const p = find(a); if (!p) return print("open: no such project. Try ls.", "cu");
    active = "All"; renderFilters(); renderList();
    const el = $("#p-" + p.id); toggle(el, true);
    el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
    print("opened " + p.id, "ok");
  },
  filter(a) {
    const t = allTags.find(x => x.toLowerCase() === (a || "").toLowerCase());
    if (!t) return print("Tags: " + allTags.join(", "), "cu");
    active = t; renderFilters(); renderList(); print("showing " + t, "ok");
  },
  education() { EDUCATION.forEach(t => print(esc(t[0]), "ok")); },
  training() { TRAINING.forEach(t => print(esc(t[0]) + " – " + esc(t[1]))); },
  skills() { SKILLS.forEach(s => print(esc(s[0]).padEnd(14) + esc(s[1]))); },
  contact() { PROFILE.links.forEach(l => print(esc(l[0]) + ": " + esc(l[1]))); },
  clear() { out.innerHTML = ""; }
};
function run(line) {
  line = line.trim(); if (!line) return;
  print("$ " + esc(line), "dim");
  const [c, ...r] = line.split(/\s+/);
  const fn = cmds[c.toLowerCase()];
  fn ? fn(r.join(" ").toLowerCase()) : print("sh: " + esc(c) + ": command not found. Type help.", "cu");
}
$("#f").addEventListener("submit", e => { e.preventDefault(); run($("#cmd").value); $("#cmd").value = ""; });
const hist = []; let hi = 0;
$("#f").addEventListener("submit", () => {});
$("#cmd").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.value.trim()) { hist.push(e.target.value); hi = hist.length; }
  if (e.key === "ArrowUp" && hi > 0) { e.preventDefault(); e.target.value = hist[--hi]; }
  if (e.key === "ArrowDown") { e.preventDefault(); e.target.value = hi < hist.length - 1 ? hist[++hi] : (hi = hist.length, ""); }
});
$("#hints").innerHTML = ["ls", "cat household-iot", "open pic24-rtos", "filter RTOS", "skills"].map(c => '<button type="button" data-c="' + c + '">' + c + "</button>").join("");
$("#hints").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) run(b.dataset.c); });
/* ----- futuristic extras ----- */
if (reduce) document.querySelectorAll(".bg animateMotion").forEach(a => a.parentNode.remove());
else if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.05 });
  document.querySelectorAll("section").forEach(sec => { sec.classList.add("rv"); io.observe(sec); });
}
